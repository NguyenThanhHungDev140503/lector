name: Build and Push VPS Image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vps-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_SHA: ${{ github.sha }}

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-image
        with:
          platform: linux/amd64
          push: true
          image_tag: sha-${{ env.IMAGE_SHA }}
          write_registry_cache: true

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-image
        with:
          platform: linux/arm64
          push: true
          image_tag: sha-${{ env.IMAGE_SHA }}
          write_registry_cache: true

  publish:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable and convenience tags
        env:
          IMAGE: ghcr.io/nguyenthanhhungdev140503/lector
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:sha-${IMAGE_SHA}" \
            -t "${IMAGE}:master" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:sha-${IMAGE_SHA}-amd64" \
            "${IMAGE}:sha-${IMAGE_SHA}-arm64"
